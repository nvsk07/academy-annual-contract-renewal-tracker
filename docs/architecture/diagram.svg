<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.1" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#f8fafc" />

  <text x="400" y="40" font-family="'Inter', sans-serif" font-size="22" font-weight="900" text-anchor="middle" fill="#0f172a">SYSTEM ARCHITECTURE DIAGRAM</text>
  <text x="400" y="65" font-family="'Inter', sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#64748b">React Client direct to Firebase Serverless Stack</text>

  <!-- User Browser -->
  <rect x="50" y="150" width="180" height="200" rx="8" fill="url(#blueGrad)" filter="url(#shadow)" />
  <text x="140" y="180" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">User Browser</text>
  <rect x="70" y="210" width="140" height="35" rx="4" fill="#ffffff" fill-opacity="0.2" />
  <text x="140" y="232" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle" fill="#ffffff">React UI Views</text>
  <rect x="70" y="260" width="140" height="35" rx="4" fill="#ffffff" fill-opacity="0.2" />
  <text x="140" y="282" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle" fill="#ffffff">Wouter Router</text>

  <!-- Connection Arrows -->
  <path d="M 230 250 L 320 250" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)" />
  
  <!-- Firebase Authentication -->
  <rect x="330" y="100" width="200" height="90" rx="8" fill="url(#greyGrad)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
  <text x="430" y="135" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e293b">Firebase Auth</text>
  <text x="430" y="160" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle" fill="#64748b">Identity Sessions</text>

  <!-- Firestore Database -->
  <rect x="330" y="220" width="200" height="150" rx="8" fill="url(#greyGrad)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
  <text x="430" y="250" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e293b">Cloud Firestore</text>
  <rect x="350" y="270" width="160" height="25" rx="4" fill="#ffffff" stroke="#cbd5e1" />
  <text x="430" y="287" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle" fill="#334155">/users collection</text>
  <rect x="350" y="305" width="160" height="25" rx="4" fill="#ffffff" stroke="#cbd5e1" />
  <text x="430" y="322" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle" fill="#334155">/contracts collection</text>
  <rect x="350" y="340" width="160" height="25" rx="4" fill="#ffffff" stroke="#cbd5e1" />
  <text x="430" y="357" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle" fill="#334155">/activities collection</text>

  <!-- Security Rules Guard -->
  <rect x="580" y="180" width="170" height="140" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="2" filter="url(#shadow)" />
  <text x="665" y="210" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#991b1b">Security Rules</text>
  <text x="665" y="235" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle" fill="#b91c1c">Row-Level Guards</text>
  <text x="665" y="260" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle" fill="#7f1d1d">Admin: View All</text>
  <text x="665" y="280" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle" fill="#7f1d1d">RMs: Restricted View</text>

  <!-- Arrow marker -->
  <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
  </marker>

  <!-- Communication paths -->
  <path d="M 230 200 L 320 150" fill="none" stroke="#64748b" stroke-dasharray="4" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 230 300 L 320 300" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 530 150 L 580 200" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 530 300 L 580 270" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
</svg>
