<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f1f5f9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cbd5e1;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-opacity="0.1" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#f8fafc" />

  <text x="400" y="40" font-family="'Inter', sans-serif" font-size="22" font-weight="900" text-anchor="middle" fill="#0f172a">ENTITY RELATIONSHIP DIAGRAM (SQL MAPPING)</text>
  <text x="400" y="65" font-family="'Inter', sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#64748b">Relational structure mapping for MySQL/PostgreSQL</text>

  <!-- Table 1: Users/RMs -->
  <g transform="translate(50, 120)" filter="url(#shadow)">
    <rect width="220" height="230" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
    <rect width="220" height="35" rx="8" fill="url(#tableGrad)" stroke="#94a3b8" stroke-width="1.5" />
    <text x="110" y="23" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e293b">relationship_managers</text>
    
    <text x="15" y="60" font-family="monospace" font-size="11" font-weight="bold" fill="#0f172a">employee_id [PK]</text>
    <text x="15" y="80" font-family="monospace" font-size="11" fill="#334155">name</text>
    <text x="15" y="100" font-family="monospace" font-size="11" fill="#334155">email [UNIQUE]</text>
    <text x="15" y="120" font-family="monospace" font-size="11" fill="#334155">role</text>
    <text x="15" y="140" font-family="monospace" font-size="11" fill="#334155">department</text>
    <text x="15" y="160" font-family="monospace" font-size="11" fill="#334155">avatar</text>
    <text x="15" y="180" font-family="monospace" font-size="11" fill="#334155">status</text>
    <text x="15" y="200" font-family="monospace" font-size="11" fill="#64748b">created_at</text>
  </g>

  <!-- Table 2: Contracts -->
  <g transform="translate(320, 100)" filter="url(#shadow)">
    <rect width="240" height="460" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2" />
    <rect width="240" height="35" rx="8" fill="#3b82f6" stroke="#3b82f6" stroke-width="2" />
    <text x="120" y="23" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">contracts</text>
    
    <text x="15" y="60" font-family="monospace" font-size="11" font-weight="bold" fill="#0f172a">id [PK]</text>
    <text x="15" y="80" font-family="monospace" font-size="11" fill="#334155">academy_name</text>
    <text x="15" y="100" font-family="monospace" font-size="11" fill="#334155">academy_type</text>
    <text x="15" y="120" font-family="monospace" font-size="11" fill="#334155">contact_person</text>
    <text x="15" y="140" font-family="monospace" font-size="11" fill="#334155">phone</text>
    <text x="15" y="160" font-family="monospace" font-size="11" fill="#334155">email</text>
    <text x="15" y="180" font-family="monospace" font-size="11" fill="#334155">address</text>
    <text x="15" y="200" font-family="monospace" font-size="11" fill="#334155">city</text>
    <text x="15" y="220" font-family="monospace" font-size="11" fill="#334155">state</text>
    <text x="15" y="240" font-family="monospace" font-size="11" fill="#334155">contract_start_date</text>
    <text x="15" y="260" font-family="monospace" font-size="11" fill="#334155">contract_end_date</text>
    <text x="15" y="280" font-family="monospace" font-size="11" fill="#334155">duration_months</text>
    <text x="15" y="300" font-family="monospace" font-size="11" fill="#334155">status</text>
    <text x="15" y="320" font-family="monospace" font-size="11" fill="#334155">equipment_categories</text>
    <text x="15" y="340" font-family="monospace" font-size="11" fill="#334155">quantity</text>
    <text x="15" y="360" font-family="monospace" font-size="11" fill="#334155">supply_frequency</text>
    <text x="15" y="380" font-family="monospace" font-size="11" font-weight="bold" fill="#0f172a">relationship_manager_id [FK]</text>
    <text x="15" y="400" font-family="monospace" font-size="11" fill="#334155">contract_value</text>
    <text x="15" y="420" font-family="monospace" font-size="11" fill="#334155">price_revision</text>
    <text x="15" y="440" font-family="monospace" font-size="11" fill="#64748b">updated_at</text>
  </g>

  <!-- Table 3: Audit Logs -->
  <g transform="translate(600, 150)" filter="url(#shadow)">
    <rect width="180" height="210" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
    <rect width="180" height="35" rx="8" fill="url(#tableGrad)" stroke="#94a3b8" stroke-width="1.5" />
    <text x="90" y="23" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e293b">audit_logs</text>
    
    <text x="15" y="60" font-family="monospace" font-size="11" font-weight="bold" fill="#0f172a">id [PK]</text>
    <text x="15" y="80" font-family="monospace" font-size="11" fill="#334155">type</text>
    <text x="15" y="100" font-family="monospace" font-size="11" fill="#334155">description</text>
    <text x="15" y="120" font-family="monospace" font-size="11" fill="#334155">actor</text>
    <text x="15" y="140" font-family="monospace" font-size="11" font-weight="bold" fill="#0f172a">contract_id [FK]</text>
    <text x="15" y="160" font-family="monospace" font-size="11" fill="#334155">contract_name</text>
    <text x="15" y="180" font-family="monospace" font-size="11" fill="#64748b">timestamp</text>
  </g>

  <!-- Relationship Connectors (Crow's Foot style approximation) -->
  <!-- managers to contracts -->
  <path d="M 270 230 L 320 230" fill="none" stroke="#64748b" stroke-width="2" />
  <circle cx="275" cy="230" r="3" fill="#64748b" />
  <line x1="315" y1="225" x2="315" y2="235" stroke="#64748b" stroke-width="2" />
  <line x1="320" y1="230" x2="312" y2="225" stroke="#64748b" stroke-width="2" />
  <line x1="320" y1="230" x2="312" y2="235" stroke="#64748b" stroke-width="2" />

  <!-- contracts to audit logs -->
  <path d="M 560 250 L 600 250" fill="none" stroke="#64748b" stroke-width="2" />
  <circle cx="565" cy="250" r="3" fill="#64748b" />
  <line x1="595" y1="245" x2="595" y2="255" stroke="#64748b" stroke-width="2" />
  <line x1="600" y1="250" x2="592" y2="245" stroke="#64748b" stroke-width="2" />
  <line x1="600" y1="250" x2="592" y2="255" stroke="#64748b" stroke-width="2" />
</svg>
