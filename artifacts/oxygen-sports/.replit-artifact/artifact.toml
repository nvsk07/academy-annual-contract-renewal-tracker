kind = "web"
previewPath = "/"
title = "Oxygen Sports - Contract Renewal Tracker"
version = "1.0.0"
id = "artifacts/oxygen-sports"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24619

[services.development]
run = "pnpm --filter @workspace/oxygen-sports run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/oxygen-sports", "run", "build" ]
publicDir = "artifacts/oxygen-sports/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24619"
BASE_PATH = "/"
